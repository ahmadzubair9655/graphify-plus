name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (Phase 0+ + daemon scope)
        # Pre-existing modules audit/, review/ and legacy test files are
        # out of Phase 0 scope and will be brought under lint as later
        # phases refactor them. The daemon (Layers 1–28) is included.
        run: |
          ruff check graphify_plus/core graphify_plus/runtime graphify_plus/interface graphify_plus/query graphify_plus/daemon scripts tests/core tests/runtime tests/interface tests/query tests/regression tests/scripts tests/daemon
          ruff format --check graphify_plus/core graphify_plus/runtime graphify_plus/interface graphify_plus/query graphify_plus/daemon scripts tests/core tests/runtime tests/interface tests/query tests/regression tests/scripts tests/daemon
      - name: Type check
        # MYPY DEADLINE: continue-on-error flips to false on 2026-08-01
        # (tracked in RISKS.md R11). Until then this step surfaces the
        # error count without blocking the build. The 'mypy deadline
        # enforcer' step below blocks if the date passes without the
        # flag being flipped.
        run: mypy graphify_plus
        continue-on-error: true
      - name: Mypy deadline enforcer
        # Hard fail if 2026-08-01 has passed and the previous step is
        # still continue-on-error: true. This is the calendar-event
        # discipline RISKS.md R11 commits to.
        run: |
          DEADLINE="2026-08-01"
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" \> "$DEADLINE" ]; then
            echo "::error::mypy deadline ($DEADLINE) has passed."
            echo "Flip continue-on-error to false on the 'Type check' step,"
            echo "fix the remaining errors, and remove this enforcer."
            exit 1
          fi
          echo "mypy deadline: $DEADLINE (today: $TODAY) — within window."
      - name: Tests
        run: pytest -q
      - name: Determinism
        run: |
          python -m graphify_plus init --repo tests/fixtures/sample_repo --print > /tmp/a.jsonl
          python -m graphify_plus init --repo tests/fixtures/sample_repo --print > /tmp/b.jsonl
          cmp /tmp/a.jsonl /tmp/b.jsonl
      - name: Doc verification (informational)
        # README contains many illustrative blocks that aren't designed
        # to run end-to-end. Until they are audited and either skipped
        # via <!-- doctest:skip --> or made self-contained, this job
        # surfaces results without blocking CI.
        run: python scripts/test_readme.py || true
      - name: Perf baseline
        run: python scripts/perf_bench.py --baseline
      - name: Daemon perfcheck (Layer 12.2 contract)
        run: |
          python -m graphify_plus init --repo tests/fixtures/sample_repo
          python -m graphify_plus daemon perfcheck --repo tests/fixtures/sample_repo --samples 100
        continue-on-error: true   # tighten when sample fixture grows past 5k symbols
