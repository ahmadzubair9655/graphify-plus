[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphify-plus"
version = "3.2.0-dev"
description = "Universal context & execution engine for AI coding agents — Tree-sitter frontend, symbol graph, skeleton CAS, MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["graphify", "knowledge-graph", "claude", "code-analysis", "audit", "diff", "tree-sitter", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",  # required by networkx centrality probes
    "scipy>=1.10",  # required by networkx pagerank
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "watchdog>=4.0",
    "pathspec>=0.12",
    "diskcache>=5.6",
    "orjson>=3.10",
    "xxhash>=3.4",
    "GitPython>=3.1",
    "tiktoken>=0.7",  # Phase 3 token-budgeted framing
    "rank-bm25>=0.2",  # Phase 4 semantic finder (pure-python, no tokenizer deps)
    "PyYAML>=6.0",  # Phase 6 rules.yaml loading
]

[project.optional-dependencies]
full = [
    "graphifyy>=0.5.0",
]
embeddings = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
]
mcp = [
    "mcp>=1.0",
]
viz = [
    "graphviz>=0.20",
]
telemetry = [
    "opentelemetry-proto>=1.25",
    "ijson>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
graphify-plus = "graphify_plus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["graphify_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
strict_optional = true
